<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamChron Logo Export</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #1890ff;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .logo-showcase {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin: 30px 0;
        }
        .logo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .logo-item svg {
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        .logo-label {
            font-size: 14px;
            color: #999;
        }
        .btn {
            background: #1890ff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #40a9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.4);
        }
        .instructions {
            background: #f6f8fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .instructions ol {
            margin-left: 20px;
            color: #666;
        }
        .instructions li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TeamChron Logo</h1>
        <p>TM字母设计方案 - 点击下方按钮下载PNG格式</p>

        <div class="logo-showcase">
            <div class="logo-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
                    <circle cx="32" cy="32" r="30" fill="#1890ff" opacity="0.1"/>
                    <rect x="12" y="14" width="18" height="6" rx="1" fill="#1890ff"/>
                    <rect x="20" y="14" width="3" height="26" rx="1.5" fill="#1890ff"/>
                    <path d="M 34 40 L 34 18 L 42 30 L 50 18 L 50 40" stroke="#1890ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="18" cy="48" r="2" fill="#52c41a"/>
                    <circle cx="32" cy="48" r="2" fill="#52c41a"/>
                    <circle cx="46" cy="48" r="2" fill="#52c41a"/>
                </svg>
                <span class="logo-label">128x128</span>
            </div>

            <div class="logo-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
                    <circle cx="32" cy="32" r="30" fill="#1890ff" opacity="0.1"/>
                    <rect x="12" y="14" width="18" height="6" rx="1" fill="#1890ff"/>
                    <rect x="20" y="14" width="3" height="26" rx="1.5" fill="#1890ff"/>
                    <path d="M 34 40 L 34 18 L 42 30 L 50 18 L 50 40" stroke="#1890ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="18" cy="48" r="2" fill="#52c41a"/>
                    <circle cx="32" cy="48" r="2" fill="#52c41a"/>
                    <circle cx="46" cy="48" r="2" fill="#52c41a"/>
                </svg>
                <span class="logo-label">256x256</span>
            </div>
        </div>

        <button class="btn" onclick="downloadPNG(64, 'teammaster-logo-64.png')">下载 64x64 PNG</button>
        <button class="btn" onclick="downloadPNG(128, 'teammaster-logo-128.png')">下载 128x128 PNG</button>
        <button class="btn" onclick="downloadPNG(256, 'teammaster-logo-256.png')">下载 256x256 PNG</button>
        <button class="btn" onclick="downloadPNG(512, 'teammaster-logo-512.png')">下载 512x512 PNG</button>

        <div class="instructions">
            <h3>📥 导出说明</h3>
            <ol>
                <li>点击上方按钮即可自动下载对应尺寸的PNG文件</li>
                <li>PNG文件已包含透明背景，可直接用于网页、文档等场景</li>
                <li>如需其他尺寸，可使用浏览器截图工具直接截图SVG</li>
                <li>Logo设计：TM字母组合，蓝色主题 + 绿色点缀</li>
            </ol>
        </div>
    </div>

    <script>
        function downloadPNG(size, filename) {
            const svg = document.querySelector('.logo-showcase svg').cloneNode(true);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);

            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const svgData = new XMLSerializer().serializeToString(svg);
            const img = new Image();

            svgData = svgData.replace(/'/g, '"');
            svgData = svgData.replace(/></g, '>\n<');

            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);

            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);

                canvas.toBlob(function(blob) {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                });
            };

            img.src = url;
        }
    </script>
</body>
</html>
