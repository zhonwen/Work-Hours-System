# GSMS 生产环境（腾讯云轻量 / 通用 VPS）
# 用法：
#   1. cp .env.prod.example .env.prod
#   2. 编辑 .env.prod 修改密码与公网地址
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# 访问：http://<公网IP>  （前端 80，/api 反代到后端）

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gsms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gsms}
      MYSQL_USER: ${MYSQL_USER:-gsms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deployment/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M
    # 生产不对外暴露 3306；需要排查时临时取消注释
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  backend:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    container_name: gsms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gsms}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-gsms}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # 新库需要 Flyway 建表（覆盖 application-prod.yml 默认关闭）
      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: 'true'
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # 同域 Nginx 反代通常不触发跨域；填公网访问来源（含 http://IP）
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TZ: Asia/Shanghai
    # 仅本机联调需要时再映射；对外只走 frontend:80
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        VITE_APP_API_BASE_URL: /api
        VITE_APP_API_TIMEOUT: '15000'
    container_name: gsms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mysql-data:
    driver: local

networks:
  default:
    name: gsms-prod-network
